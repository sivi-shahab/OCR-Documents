[project]
name = "ocr-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pymupdf>=1.24", "pillow>=10.4", "numpy", "openpyxl>=3.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools]
packages = ["ocr_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
