services:
  vllm:
    image: vllm/vllm-openai:unlimited-ocr
    command:
      - baidu/Unlimited-OCR
      # HF commit 8249d20 (2026-10-14) renamed model_type to "unlimited_ocr", which this
      # image does not recognise. Pin the last compatible revision (same weights).
      - --revision=07dea832e22aefee32ad281d4b80551282e1c168
      - --served-model-name=Unlimited-OCR
      - --trust-remote-code
      - --logits_processors=vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor
      - --no-enable-prefix-caching
      - --mm-processor-cache-gb=0
      # 32k is only needed by strategy=whole_document; per-page requests stay under ~12k tokens.
      - --max-model-len=32768
      # Many short per-page sequences: batch wide. Starting points, tune with `vllm bench serve`.
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-128}
      - --max-num-batched-tokens=${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
    ipc: host
    ports:
      - "${VLLM_PORT:-8100}:8000"
    volumes:
      - ${HF_CACHE_DIR:-/data/hf-cache}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped

  api:
    build: .
    image: local/unlimited-ocr-api:latest
    environment:
      OCR_VLLM_BASE_URL: http://vllm:8000/v1
    env_file:
      - path: .env
        required: false
    ports:
      - "${API_PORT:-8200}:8000"
    volumes:
      - ocr-jobs:/data/jobs
    depends_on:
      vllm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ocr-jobs:
